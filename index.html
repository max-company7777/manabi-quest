<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#211a14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="まなびクエスト">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<title>まなびクエスト</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Klee+One:wght@600&family=M+PLUS+Rounded+1c:wght@800&display=swap" rel="stylesheet">
<style>
:root{--bg:#211a14;--wood:#3b2f24;--wood2:#4a3b2c;--edge:#120d09;--stone:#5b5e63;--ink:#fff;--sub:#d8cbb4;--gold:#ffd23f;--xp:#7bea5a;
--r0:#c9c9c9;--r1:#3ec1ff;--r2:#c15cff;--r3:#ffae1a;--r4:#ff4f7b;--r5:#7af0ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'DotGothic16',system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
body{background-image:linear-gradient(45deg,#ffffff05 25%,transparent 25%,transparent 75%,#ffffff05 75%),linear-gradient(45deg,#ffffff05 25%,transparent 25%,transparent 75%,#ffffff05 75%);background-size:32px 32px;background-position:0 0,16px 16px}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:active{transform:translateY(3px)}
input{font:inherit}
#app{height:100dvh;max-width:760px;margin:0 auto;position:relative;display:flex;flex-direction:column}
.screen{display:none;flex:1;flex-direction:column;min-height:0}
.screen.on{display:flex}
.panel{background:var(--wood);border:3px solid var(--edge);box-shadow:inset 0 3px 0 #ffffff1a,inset 0 -3px 0 #0005,0 4px 0 #0008;border-radius:6px}
.btn{background:#6b6f75;border:3px solid var(--edge);box-shadow:inset 0 3px 0 #ffffff33,inset 0 -4px 0 #0006;border-radius:6px;padding:12px;font-size:18px}
.btn.green{background:#3f9b3a}.btn.orange{background:#d9771e}.btn.gray{background:#4c4f54}.btn.purple{background:#7a4bd1}
.big{width:100%;font-size:22px;padding:15px}
.row{display:flex;gap:10px}
.row>*{flex:1}

/* players */
.pl-body{flex:1;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:14px}
.title{text-align:center;font-size:clamp(30px,9vw,46px);color:var(--gold);text-shadow:3px 3px 0 #000;margin:10px 0 0}
.title small{display:block;font-size:14px;color:var(--sub);text-shadow:none}
.pcard{display:flex;align-items:center;gap:14px;padding:12px;text-align:left;width:100%}
.pcard .av{width:68px;flex:none}.pcard .av .hs{width:100%}
.pcard .nm{font-size:22px}
.pcard small{color:var(--sub);font-size:14px}
.pcard .pw{margin-left:auto;text-align:center}
.pcard .pw b{display:block;font-size:26px;color:var(--gold)}

/* home */
.top{display:flex;align-items:center;gap:8px;padding:10px 12px 4px}
.who{background:var(--wood2);border:3px solid var(--edge);border-radius:6px;padding:6px 10px;font-size:15px;white-space:nowrap;max-width:36%;overflow:hidden;text-overflow:ellipsis}
.lv{background:#2e6b2b;border:2px solid var(--edge);padding:3px 8px;border-radius:4px;font-size:14px;white-space:nowrap}
.xpbar{flex:1;height:12px;background:#000a;border:2px solid var(--edge);border-radius:3px;overflow:hidden;min-width:30px}
.xpbar i{display:block;height:100%;background:var(--xp);width:0;transition:width .4s}
.pill{background:#0006;padding:4px 8px;border-radius:4px;font-size:14px;white-space:nowrap}
.homebody{flex:1;overflow-y:auto;padding:8px 12px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.show{display:grid;grid-template-columns:minmax(84px,104px) 1fr minmax(84px,104px);gap:6px;padding:8px;align-items:center}
.slots{display:flex;flex-direction:column;gap:6px}
.slot{display:flex;align-items:center;gap:5px;background:#0005;border:3px solid var(--rc,#444);border-radius:6px;padding:4px;text-align:left;width:100%}
.slot .ic{width:36px;height:36px;display:grid;place-items:center;font-size:24px;background:#0006;border-radius:4px;flex:none}
.slot .sn{font-size:11px;line-height:1.2;color:var(--rc,var(--sub))}
.slot .sn b{display:block;color:var(--gold);font-size:17px;font-weight:400}
.slot.empty{border-style:dashed}
.slot.empty .ic{filter:grayscale(1);opacity:.35}
.slot.empty .sn{color:#888}
.herobox{position:relative;display:flex;flex-direction:column;align-items:center}
.herobox .hs{width:100%;max-width:200px}
.powbig{cursor:pointer;display:flex;align-items:center;gap:6px;background:#000a;border:3px solid var(--gold);padding:4px 14px;border-radius:6px;margin-top:-6px}
.powbig small{font-size:13px;color:var(--sub)}
.powbig b{font-size:30px;color:var(--gold);text-shadow:2px 2px 0 #000}
.statrow{display:grid;grid-template-columns:repeat(3,auto);justify-content:center;gap:2px 10px;font-size:12px;margin-top:6px;color:var(--sub)}
.statrow b{color:#fff;font-size:15px}
.mis{padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.pbar{height:14px;background:#000a;border:2px solid var(--edge);border-radius:3px;overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,#ffd23f,#ff8a3d)}
.mis small{color:var(--sub)}
.claim{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.03)}}
.subj{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sbtn{padding:10px 4px;text-align:center;font-size:17px}
.sbtn .e{font-size:30px;display:block;font-family:'Klee One',serif}
.sbtn.sel{outline:4px solid var(--gold);outline-offset:-2px}
.diff{padding:10px;display:flex;flex-direction:column;gap:8px}
.dblocks{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.db{padding:8px 0;font-size:15px;background:#4c4f54}
.db.sel{background:#d9771e;outline:3px solid var(--gold);outline-offset:-2px}
.dinfo{font-size:15px;text-align:center}
.dinfo small{display:block;color:var(--sub);font-size:12px}
.stagepick{display:flex;align-items:center;justify-content:center;gap:16px;font-size:20px}
.stagepick button{width:50px;height:50px;padding:0;font-size:20px}
.stagepick button:disabled{opacity:.3}

/* battle */
.hud{display:flex;align-items:center;gap:8px;padding:8px 10px}
.x{width:42px;height:42px;padding:0;font-size:18px}
.bpow{background:#000a;border:3px solid var(--gold);border-radius:6px;padding:2px 10px;text-align:center;line-height:1.1}
.bpow small{font-size:10px;color:var(--sub);display:block}
.bpow b{font-size:22px;color:var(--gold)}
.mslots{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);display:flex;gap:3px;z-index:3}
.ms{width:min(8vw,32px);height:min(8vw,32px);display:grid;place-items:center;font-size:min(4.4vw,18px);background:#000a;border:2px solid var(--rc,#444);border-radius:4px}
.ms.empty{border-style:dashed;filter:grayscale(1);opacity:.4}
.bst{margin-left:auto;font-size:14px;text-align:right}
.arena{flex:1;min-height:170px;position:relative;overflow:hidden;margin:0 10px;border:3px solid var(--edge);border-radius:6px}
.arena::after{content:'';position:absolute;left:0;right:0;bottom:0;height:20%;background:repeating-linear-gradient(90deg,#0003 0 24px,#0000 24px 48px),linear-gradient(var(--g1,#4f7d2f),var(--g2,#3b5d22));border-top:4px solid var(--g3,#6aa83e);z-index:0}
.fighter{position:absolute;bottom:17%;line-height:1;z-index:2}
.fighter>.in{display:inline-block;animation:bob 1.6s ease-in-out infinite}
.hero{left:6%}
.hero .hs{width:clamp(100px,30vw,175px)}
.mon{right:7%}
.mon .mxs{display:block;width:clamp(84px,24vw,140px);height:auto;aspect-ratio:1}
.mon.boss .mxs{width:clamp(130px,36vw,210px)}
.ui{position:absolute;top:8px;z-index:3;font-size:13px;width:42%}
.ui.l{left:8px}.ui.r{right:8px;text-align:right}
.bar{height:14px;background:#000a;border:2px solid var(--edge);border-radius:3px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;width:100%;background:#e8413c;transition:width .3s}
.bar.hp i{background:#58d14a}
.combo{position:absolute;top:40px;left:0;right:0;text-align:center;z-index:3;font-size:22px;color:var(--gold);text-shadow:2px 2px 0 #000}
.gauge{margin:6px 10px 0;height:10px;background:#000a;border:2px solid var(--edge);border-radius:3px;overflow:hidden}
.gauge i{display:block;height:100%;width:0;background:#ffb020}
.gauge i.warn{background:#ff4d4d}
.gauge.off{visibility:hidden}
.qpanel{padding:6px 10px calc(12px + env(safe-area-inset-bottom))}
.qwrap{position:relative;margin:2px 0 8px;padding:8px 46px;min-height:84px;display:flex;align-items:center;justify-content:center}
.q{text-align:center;font-family:'Klee One','M PLUS Rounded 1c',serif;font-size:clamp(34px,10vw,56px);line-height:1.15;color:#fff}
.q .sm{font-size:.5em;color:var(--sub);display:block}
.q .em{font-size:1.4em;line-height:1.1}
.q .pics{font-size:clamp(28px,8vw,42px);letter-spacing:2px;line-height:1.2;display:block}
.q .bl{color:var(--gold);border-bottom:4px solid var(--gold);padding:0 6px}
.q .ans{color:#7bea5a}
.q .tag{font-family:'DotGothic16';font-size:13px;background:#e8413c;padding:2px 6px;border-radius:4px;vertical-align:middle;margin-right:6px}
.spk{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:40px;height:40px;padding:0;font-size:20px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choices.c3{grid-template-columns:1fr 1fr 1fr}
.ch{background:#f4ead7;color:#2b2016;border:3px solid var(--edge);box-shadow:inset 0 -5px 0 #c9b998;border-radius:6px;font-family:'Klee One','M PLUS Rounded 1c',serif;font-size:clamp(26px,8vw,40px);height:clamp(62px,10.5vh,92px);padding:0 4px;line-height:1.1}
.ch.emoji{font-size:clamp(36px,11vw,54px)}
.ch.small{font-size:clamp(18px,5.4vw,26px)}
.ch.ok{background:#58d14a;color:#fff;box-shadow:inset 0 -5px 0 #2f8a25}
.ch.ng{background:#e8413c;color:#fff;box-shadow:inset 0 -5px 0 #9e231f;animation:shake .3s}

/* fx */
.hs{display:block;aspect-ratio:33/41;height:auto}
@keyframes aurarb{0%{filter:drop-shadow(0 0 5px #ff4f7b)}25%{filter:drop-shadow(0 0 5px #ffd23f)}50%{filter:drop-shadow(0 0 5px #58d14a)}75%{filter:drop-shadow(0 0 5px #4aa0ff)}100%{filter:drop-shadow(0 0 5px #ff4f7b)}}
.hs.aura-rb{animation:aurarb 2.4s linear infinite}
.pxi{display:block;width:84%;height:84%}
.slot .ic .pxi,.ms .pxi{width:86%;height:86%}
.item .ie .pxi{width:46px;height:46px}
.chest .pxi{width:72px;height:72px;margin:0 auto}
.statrow span{display:flex;align-items:center;gap:3px}
.statrow .pxi{width:15px;height:15px}
.hs .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.15)}}
.hs .wpn{transform-box:view-box;transform-origin:13px 16px}
.hero.atk .wpn{animation:swing .38s ease-out}
@keyframes swing{0%{transform:rotate(-40deg)}45%{transform:rotate(85deg)}100%{transform:rotate(0)}}
.hero.hurt .eyes{animation:none;transform:scaleY(.3)}
.look{display:flex;justify-content:center}.look .hs{width:140px}
@keyframes bob{50%{transform:translateY(-5px)}}
.hero.atk{animation:dash .38s ease-in-out}
@keyframes dash{40%{transform:translateX(min(40vw,280px)) rotate(6deg)}100%{transform:none}}
.mon.hit{animation:hit .3s}
@keyframes hit{0%,100%{transform:none;filter:none}30%{transform:translateX(16px) rotate(8deg);filter:brightness(3) saturate(0)}60%{transform:translateX(-8px)}}
.mon.lunge{animation:lunge .45s ease-in-out}
@keyframes lunge{40%{transform:translateX(max(-40vw,-280px)) scale(1.1)}100%{transform:none}}
.hero.hurt{animation:hurt .4s}
@keyframes hurt{25%{transform:translateX(-14px) rotate(-8deg);filter:drop-shadow(0 0 10px red) brightness(1.4)}75%{transform:translateX(6px)}}
.mon.die{animation:die .7s forwards}
@keyframes die{30%{transform:scale(1.2) rotate(-10deg);filter:brightness(3)}100%{transform:scale(0) rotate(200deg);opacity:0}}
.mon.spawn{animation:spawn .5s ease-out}
@keyframes spawn{from{transform:translateX(120%) scale(.6);opacity:0}}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translate(-6px,3px)}50%{transform:translate(6px,-3px)}75%{transform:translate(-3px,2px)}}
.arena.flash{box-shadow:inset 0 0 0 999px #ff000040}
.float{position:absolute;z-index:5;font-size:32px;color:#fff;text-shadow:3px 3px 0 #000;animation:float .9s ease-out forwards;pointer-events:none;white-space:nowrap}
.float.crit{color:var(--gold);font-size:42px}
.float.xp{color:var(--xp);font-size:22px}.float.gold{color:var(--gold);font-size:22px}
.float.hurt{color:#ff6b5b}.float.info{font-size:20px;color:#8ff}
@keyframes float{0%{transform:translateY(10px) scale(.6);opacity:0}20%{transform:translateY(0) scale(1.15);opacity:1}100%{transform:translateY(-60px);opacity:0}}
.slash{position:absolute;z-index:4;width:150px;height:150px;border-radius:50%;border-top:10px solid #fff;filter:drop-shadow(0 0 10px #8ff);animation:slash .28s ease-out forwards;pointer-events:none}
.slash.crit{border-top-color:var(--gold);filter:drop-shadow(0 0 14px #ffb020);width:200px;height:200px}
@keyframes slash{from{transform:rotate(-80deg);opacity:1}to{transform:rotate(60deg);opacity:0}}
@keyframes pop{50%{transform:scale(1.35)}}
.pop{animation:pop .3s}




.item .fx{font-size:12px;color:#9fe0ff;font-family:'M PLUS Rounded 1c',sans-serif}
.item .fx.u{color:#ff8fb0}
.slot .pl{font-style:normal;color:#7bea5a;font-size:11px;margin-left:2px}


.elt{display:inline-block;background:#0006;border:2px solid var(--ec);color:var(--ec);border-radius:4px;padding:1px 8px;font-size:14px}
.skl{font-size:13px;background:#0005;border-radius:6px;padding:6px 8px;color:#9fe0ff;font-family:'M PLUS Rounded 1c',sans-serif}
.skl small{color:var(--sub)}
.eb{position:absolute;top:1px;right:2px;font-style:normal;font-size:12px}
.elchart{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:13px;margin-top:4px}


@keyframes ultg{0%{filter:drop-shadow(0 0 6px #7af0ff) drop-shadow(0 0 2px #fff)}50%{filter:drop-shadow(0 0 10px #ff4fd8) drop-shadow(0 0 3px #fff)}100%{filter:drop-shadow(0 0 6px #7af0ff) drop-shadow(0 0 2px #fff)}}
.mon.r5 .mxs,.ultglow img,.r5glow img{animation:ultg 1.6s infinite}
.mon.ult .mxs{width:clamp(170px,46vw,250px)}
.mbox.r5{animation:pop .3s,ultbox 2s infinite}
@keyframes ultbox{0%,100%{box-shadow:0 0 40px #7af0ff,0 0 90px #ff4fd880}50%{box-shadow:0 0 50px #ff4fd8,0 0 100px #7af0ff80}}
.arena.ultfx{animation:ultflash 1.5s}
@keyframes ultflash{0%,30%,60%{box-shadow:inset 0 0 0 999px #ffffff60}15%,45%,80%{box-shadow:inset 0 0 0 999px #7af0ff30}100%{box-shadow:none}}
.ultbox{border-color:#7af0ff}
.ultrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ultc{background:#0006;border:3px solid var(--r5);border-radius:6px;padding:6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px}
.ultc>div{width:100%}.ultc img{width:100%;height:auto;display:block}
.ultc b{font-size:11px;font-weight:400}.ultc small{font-size:9px;color:var(--sub);line-height:1.3}
.ultc.sil b{color:#aaa}


.frbar{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin:0 10px}
.frbar i{height:16px;border:2px solid var(--edge);border-radius:3px;background:#0006}
.frbar i.on{background:linear-gradient(135deg,#7af0ff,#ff4fd8);box-shadow:0 0 6px #7af0ff}

.dcode{height:110px;font-size:11px;text-align:left;word-break:break-all;font-family:monospace}

.adcard{padding:10px;display:flex;flex-direction:column;gap:8px}
.adtop{display:flex;gap:10px;align-items:center}.adtop .av{width:58px;flex:none}.adtop .av .hs{width:100%}
.adinfo{flex:1;min-width:0}.adinfo .nm{font-size:19px}.adinfo .nm small{font-size:12px;color:var(--sub)}.adinfo>small{font-size:12px;color:var(--sub)}
.adst{display:flex;gap:10px;font-size:12px;color:var(--sub)}.adst b{font-size:16px;color:#fff;margin-left:2px}
.adgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;text-align:center}
.adgrid div{background:#0005;border-radius:5px;padding:5px 2px;line-height:1.25}.adgrid small{display:block;font-size:10px;color:var(--sub)}.adgrid b{font-size:15px}
.adsub{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px}.adsub small{color:var(--sub);font-size:10px}
.adweak{font-size:12px;color:#ffb0a0;background:#e8413c22;border-left:4px solid #e8413c;padding:5px 8px;border-radius:4px;font-family:'M PLUS Rounded 1c',sans-serif}
.adparty{display:flex;align-items:center;gap:4px;flex-wrap:wrap}.adparty>div{width:34px}.adparty img{width:100%;display:block}.adparty small{font-size:11px;color:var(--sub);flex:1;min-width:120px}


.adcard.remote{border-color:#7a4bd1}
.rtag{font-size:12px;color:#c8b8ff}

.byewarn{background:#e8413c33;border:2px solid #e8413c;border-radius:6px;padding:6px;color:#ffb0a0;font-size:14px}
.fv{position:absolute;top:1px;left:2px;font-style:normal;font-size:11px}

.rktabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.rktabs .db{font-size:11px;padding:8px 0}
.rkrow{display:flex;align-items:center;gap:8px;padding:8px 10px}
.rkrow.top1{border-color:#ffd23f;box-shadow:0 0 14px #ffd23f66}.rkrow.top2{border-color:#c9c9c9}.rkrow.top3{border-color:#c0703a}
.rkrow.me{background:#3a4a2c}
.rkm{width:44px;text-align:center;flex:none}.rkb{position:relative;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:40px;height:44px;background:linear-gradient(#4a5a7a,#2a3450);border:3px solid #000;clip-path:polygon(0 0,100% 0,100% 78%,50% 100%,0 78%);box-shadow:inset 0 3px 0 #ffffff33;line-height:1}.rkb b{font-family:'DotGothic16',monospace;font-size:20px;color:#fff;text-shadow:2px 2px 0 #000;margin-top:-4px}.rkb small{font-size:9px;color:#fff;opacity:.85}.rkb.r1{background:linear-gradient(#ffe680,#d99a1a)}.rkb.r2{background:linear-gradient(#f0f4f8,#9aa4b0)}.rkb.r3{background:linear-gradient(#f0a868,#a0602a)}.rkb.r1 b,.rkb.r2 b,.rkb.r3 b{color:#fff;text-shadow:2px 2px 0 #0008,-1px -1px 0 #0006}.rkm{position:relative}.rkcr{position:absolute;left:50%;top:-13px;transform:translateX(-50%) rotate(-10deg);width:24px;height:24px;z-index:2;filter:drop-shadow(1px 1px 0 #000)}.rkav{width:44px;flex:none}.rkav .hs{width:100%}
.rkn{flex:1;min-width:0}.rkn b{font-size:17px}.rkn small{display:block;font-size:11px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.metag{font-size:10px;background:#58d14a;color:#123;border-radius:3px;padding:0 4px;vertical-align:middle}
.rkv{text-align:right;line-height:1.1}.rkv b{font-size:24px;color:var(--gold)}.rkv small{display:block;font-size:10px;color:var(--sub)}


.evob{background:#0005;border:2px solid #7a4bd1;border-radius:6px;padding:8px;display:flex;flex-direction:column;gap:5px;text-align:left}
.evob.ready{border-color:#ffd23f;box-shadow:0 0 12px #ffd23f88}
.evr{font-size:12px}.evr .pbar{height:10px;margin-top:2px}
.evb{position:absolute;bottom:14px;right:2px;font-style:normal;font-size:13px;animation:pulse 1s infinite}
.evostage{position:relative;width:160px;height:160px;margin:0 auto}
.evostage>div{position:absolute;inset:0}.evostage img{width:100%;height:auto;display:block}
.evo-a{animation:evoA 2.6s forwards}.evo-b{opacity:0;animation:evoB 2.6s forwards}
@keyframes evoA{0%{opacity:1;filter:none}15%,35%,55%,75%{opacity:1;filter:brightness(8)}25%,45%,65%{opacity:0}85%,100%{opacity:0}}

function bowTo(m,pal,ox,oy){

  [[8,0],[9,0],[8,15],[9,15]].forEach(([x,y])=>px(m,ox+x,oy+y,pal.o,false));
  for(let y=1;y<=14;y++)if(!m.has((ox+7)+','+(oy+y)))px(m,ox+7,oy+y,pal.S,false);
  px(m,ox+12,oy+7,pal.r);px(m,ox+12,oy+8,pal.r);
}

const cosName=key=>{const [c,k]=key.split(':');return COSCAT[c][k][0]},furnName=key=>{const [t,k]=key.split(':');return FURN[t].v.find(v=>v[0]===k)[1]};

    z.items.forEach(it=>{P.dex.items[ikey(it)]=1;if(P.box.length<boxCap()){P.box.push(it);S.items.push(it)}else{P.gold+=itPrice(it);S.sold++}});

function jpHolBase(d){const y=d.getFullYear(),m=d.getMonth()+1,dt=d.getDate(),wd=d.getDay(),nth=Math.ceil(dt/7);
  if([[1,1],[2,11],[2,23],[4,29],[5,3],[5,4],[5,5],[8,11],[11,3],[11,23]].some(([a,b])=>a===m&&b===dt))return true;

  const k=Math.floor((y-1980)/4);if(m===3&&dt===Math.floor(20.8431+.242194*(y-1980)-k))return true;if(m===9&&dt===Math.floor(23.2488+.242194*(y-1980)-k))return true;return false}

  else{const four=k!=='pop'||true;if(s%4===0)kick(t,.85,k==='boss');if(s===4||s===12){noise(t,.16,{type:'bandpass',f:k==='boss'?1400:2200,q:.9,v:.22,rev:.25});noise(t,.08,{f:5000,v:.08})}

  if(s===0){const dur=sp*15.5;if(tr.pad==='keys')cn.forEach((n,i)=>voice(t+i*.012,NT(n),dur*.55,{type:'triangle',cut:2400,a:.005,d:.6,sus:.35,rel:.6,v:.055,rev:.35}));
    else cn.forEach(n=>voice(t,NT(n),dur,{type:'sawtooth',det:14,uni:3,cut:tr.pad==='dark'?700:1100,a:.25,d:.3,sus:.8,rel:.5,v:.045,rev:.4}))}
  if(tr.pad==='keys'&&s===8)cn.slice(1).forEach((n,i)=>voice(t+i*.012,NT(n),sp*6,{type:'triangle',cut:2200,a:.005,d:.5,sus:.3,rel:.5,v:.04,rev:.35}));

  /* メロディ（コードトーンから） */const lp=tr.leadP[s];if(L>=2&&lp>=0){const sc=[...cn,cn[0]+12,cn[1]+12,cn[2]+12],n=sc[Math.min(sc.length-1,lp)]+12+(L>=6&&s<8?2:0);let len=1;for(let j=s+1;j<16&&tr.leadP[j]===-1;j++)len++;

function bgmSched(){if(!BG.cur||!AC)return;const tr=BGMS[BG.cur],sp=60/tr.bpm/4;

function bgm(name){if(!G.bgmOn){bgmStop();return}if(name===BG.cur)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();bgInit();
  if(AC.state!=='running'){BG.cur=null;return}const t=AC.currentTime;BG.gain.gain.cancelScheduledValues(t);BG.gain.gain.setValueAtTime(.001,t);BG.gain.gain.linearRampToValueAtTime(.5*((BGMS[name]||{}).vol||1),t+.6);

  AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state!=='running')AC.resume();

  if(G.bgmOn){const on=document.querySelector('.screen.on'),want=BGMAP[on?on.id:'home']||'home';if(BG.cur!==want&&BG.cur!=='boss')bgm(want);else if(BG.cur&&AC.currentTime>BG.next+1){BG.next=AC.currentTime+.05}}}catch(e){}}

const strHash=s=>{let h=2166136261;for(const ch of String(s)){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0};

function sceneURL(a,W=128,H=80,o={}){const key='scn|'+a.n+'|'+W+'|'+H+'|'+(o.noGround?1:0)+(o.night?'n':'');if(IMGC[key])return IMGC[key];
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;const g=cv.getContext('2d'),F=(x,y,w,h,c)=>{g.fillStyle=typeof c==='string'?c:rgb(c);g.fillRect(x|0,y|0,w|0||1,h|0||1)};

  else{const sx=W*.8,sy=H*.15;for(let yy=-7;yy<=7;yy++)for(let xx=-7;xx<=7;xx++){const d=xx*xx+yy*yy;if(d<=49)F(sx+xx,sy+yy,1,1,d<=20?'#fffbe0':d<=36?'#fff0a0':rgb(mixc(hx('#fff0a0'),bot,.5)))}}
  /* くも */
  const cloud=(cx,cy,s,c,sh)=>{for(let k=0;k<4;k++){const r=s*(.5+rnd()*.5),ox=cx+(k-1.5)*s*.9,oy=cy-(k%2?s*.3:0);for(let yy=-r;yy<=r;yy++)for(let xx=-r*1.3;xx<=r*1.3;xx++)if(xx*xx/1.69+yy*yy<=r*r)F(ox+xx,oy+yy,1,1,yy>r*.35?sh:c)}};
  const cc=dark?[110,110,140]:[255,255,255],cs2=dark?[80,80,110]:mixc([255,255,255],bot,.45);for(let i=0;i<3+rnd()*2;i++)cloud(rnd()*W,H*(.1+rnd()*.25),3+rnd()*3,cc,cs2);
  /* とおくの やま */

  for(let x=0;x<W;x++){const h=GY*(.32+.12*Math.sin(x/W*6+ph[0])+.07*Math.sin(x/W*15+ph[1])+.03*Math.sin(x/W*37+ph[2]));const yT=GY-h;for(let y=yT;y<GY;y++)F(x,y,1,1,y<yT+2?far2:far);
    if(el==='こおり'&&h>GY*.36)F(x,yT,1,4,'#f4fbff')}
  if(el==='ほのお'){const vx=W*.3,vh=GY*.62;for(let y=0;y<vh;y++){const w=y*.9+3;F(vx-w,GY-vh+y,w*2,1,mixc(G1,[40,10,10],.3))}F(vx-3,GY-vh,6,2,'#ff6a2a');F(vx-2,GY-vh-1,4,1,'#ffd23f');for(let i=0;i<5;i++)F(vx-2+rnd()*4,GY-vh-3-rnd()*8,2,2,'#777')}

  for(let x=0;x<W;x++){const h=GY*(.16+.05*Math.sin(x/W*9+ph2)+.02*Math.sin(x/W*23));const yT=Math.round(GY-h);tops[x]=yT;for(let y=yT;y<GY;y++)F(x,y,1,1,(y-yT)%5===0&&(x+y)%3===0?midS:mid)}

const pad=n=>String(n).padStart(2,'0');

const MCAT={'4m':'かけざん（2けた×2けた）','4d':'わりざん（3けた÷1けた）','4r':'あまりの ある わりざん','4f':'しょうすうの たしひき','4q':'ぶんすうの たしざん','4a':'ながしかくの めんせき','5m':'しょうすう×せいすう','5n':'しょうすう×しょうすう','5q':'つうぶんの たしざん','5v':'へいきん','5t':'さんかくけいの めんせき','5p':'わりあい（％）','5l':'さいしょう こうばいすう','6m':'ぶんすうの かけざん','6d':'ぶんすうの わりざん','6r':'ひ','6c':'えんの めんせき','6s':'はやさ','6t':'みちのり','6u':'じかん','6x':'もじと しき'};
function catOf(subj,key){
  if(subj==='math'){if(key[0]==='c')return 'かずを かぞえる';if(key[0]==='g')return MCAT[key.slice(1,3)]||'けいさん';const m=key.match(/^(\d+)([+−×÷])(\d+)$/);if(!m)return 'けいさん';const x=+m[1],y=+m[3],op=m[2];
    if(op==='+')return x%10+y%10>=10?'たしざん（くりあがり あり）':'たしざん（くりあがり なし）';
    if(op==='−')return x%10<y%10?'ひきざん（くりさがり あり）':'ひきざん（くりさがり なし）';
    if(op==='×')return x<10&&y<10?`かけざん ${x}のだん`:'かけざん（2けた×1けた）';
    return 'わりざん'}
  if(subj==='eng')return {el:'きいて えらぶ',ep:'え→えいたんご',ej:'にほんご→えいご',es:'つづり',ee:'えいご→にほんご',e4:'ようび・つき・てんき',e5:'ぶんを かんせい',e6:'かこの ことば'}[key.slice(0,2)]||'えいご';
  if(key.startsWith('h'))return 'ひらがな';if(key.startsWith('k1p'))return 'かんじ1年（え→かんじ）';
  const k=key.match(/^k([2-7])/);return k?{2:'かんじ1年（よみ）',3:'かんじ2年（よみ）',4:'かんじ3年（じゅくご）',5:'かんじ4年（よみ）',6:'かんじ5年（よみ）',7:'かんじ6年（よみ）'}[k[1]]:'こくご';
}
function record(q,ok,t){

  const S=P.stats||(P.stats={cats:{},days:{},items:{}});const subj=q.subj||'math';
  const ck=subj+'|'+catOf(subj,q.key),c=S.cats[ck]||(S.cats[ck]={n:0,ok:0,t:0});c.n++;if(ok)c.ok++;c.t+=Math.min(t,30);

  const it=S.items[q.key]||(S.items[q.key]={n:0,miss:0,label:labelOf(q),subj,a:q.a});it.n++;if(!ok)it.miss++;
  const ks=Object.keys(S.items);if(ks.length>300){ks.sort((a,b)=>S.items[a].miss-S.items[b].miss||S.items[a].n-S.items[b].n);ks.slice(0,60).forEach(k=>delete S.items[k])}

function tipFor(name){

  if(name.includes('のだん'))return 'その段だけを声に出して唱える練習がおすすめです。お風呂での九九も効果的です。';
  if(name.includes('2けた×'))return '「10のくらい」と「1のくらい」に分けて計算する方法を確認してみましょう。';
  if(name.includes('わりざん'))return 'わり算は九九の逆です。まず九九の正答率もあわせて確認してください。';

  const base=`https://www.gstatic.com/firebasejs/${FB_V}/`;
  FBP=Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]).then(async([A,U,F])=>{
    const app=A.initializeApp(FB_CONFIG),auth=U.getAuth(app);await U.signInAnonymously(auth);
    let db;try{db=F.initializeFirestore(app,{localCache:F.persistentLocalCache()})}catch(e){db=F.getFirestore(app)}
    FB={db,F};return FB}).catch(e=>{console.warn('fb',e);FBP=null;return null});
  return FBP;
}
let syncT=null;
function queueSync(){if(!FB_CONFIG||!G.fam)return;clearTimeout(syncT);syncT=setTimeout(syncUp,4000)}
async function syncUp(){
  const f=await fbInit();if(!f||!G.fam)return false;if(!G.devId){G.devId=uid();store.set('mq1',G)}
  const profs=G.profiles.filter(p=>!p.master).map(p=>{const c=Object.assign({},p);c.boxN=(p.box||[]).length;delete c.box;return c});
  try{await f.F.setDoc(f.F.doc(f.db,'families',G.fam,'devices',G.devId),{name:G.devName||'たんまつ',updated:Date.now(),profiles:JSON.stringify(profs)});
    G.lastSync=Date.now();store.set('mq1',G);return true}catch(e){console.warn('sync',e);return false}
}
async function syncDown(){
  const f=await fbInit();if(!f||!G.fam)return null;const out=[];
  try{const qs=await f.F.getDocs(f.F.collection(f.db,'families',G.fam,'devices'));
    qs.forEach(d=>{if(d.id===G.devId)return;const v=d.data();let ps=[];try{ps=JSON.parse(v.profiles||'[]')}catch(e){}
      ps.forEach(p=>{p._remote=v.name||'たんまつ';p._upd=v.updated;p.box=[];out.push(ensureP(p))})})}catch(e){console.warn('down',e);return null}
  return out;
}

  const subj={};for(const [k,v] of Object.entries(S.cats)){const sb=k.split('|')[0];subj[sb]=subj[sb]||{n:0,ok:0};subj[sb].n+=v.n;subj[sb].ok+=v.ok}

    ${P.weak.length?`<p class="wkmsg">📕 にがてが あと ${P.weak.length}もん。<br>ゼロに すると つぎの ステージへ すすめるよ！</p><button class="btn purple big" id="wk">📕 にがてを やっつける</button>`:B.weakOnly?'<p class="wkmsg">🎉 にがて ゼロ！ すすめるように なったよ</p><button class="btn orange big" id="nx2">つぎの ステージへ ▶</button>':'<button class="btn orange big" id="nx">つぎの ステージへ ▶</button>'}<button class="btn gray big" id="hm">ホームへ</button>`,
    {nx:()=>{closeModal();const lv=B.blv;processHatch(()=>startBattle(subj,lv,st+1,false))},
     nx2:()=>{closeModal();const ns=(P.best[P.subj]||0)+1;selStage=ns;processHatch(()=>startBattle(P.subj,P.diff[P.subj],ns,false))},
     wk:()=>{closeModal();processHatch(()=>startWeak())},hm:()=>{closeModal();goHome()}});
}
function gameOver(){
  if(!B)return;if(B.tower){towerEnd();return}B.lock=true;if(!B.sawUlt&&!B.weakOnly&&ultUnlocked().length)P.ultMiss=(P.ultMiss||0)+1;save();const {bsubj:subj,blv:lv,stage,weakOnly}=B;snd(300,.6,'triangle',.07,-220);
  showModal(`<div class="chest nofx">😵</div><div class="mt">やられちゃった…</div>
    <p>でも だいじょうぶ！<br>けいけんち と ゴールドは のこっているよ。<br>そうびを つよくして もういちど！</p>
    <button class="btn orange big" id="rt">もういちど</button><button class="btn gray big" id="hm">ホームへ</button>`,
    {rt:()=>{closeModal();startBattle(subj,lv,stage,weakOnly)},hm:()=>{closeModal();goHome()}});
}
function goHome(){B=null;try{speechSynthesis.cancel()}catch(e){}show('home');renderHome();processHatch(renderHome)}
$('quit').onclick=()=>{if(!B||B.lock)return;B.lock=true;
  showModal(`<div class="mt">にげる？</div><p>ここまでの けいけんち と ゴールドは のこるよ。</p>
    <button class="btn green big" id="bk">たたかう！</button><button class="btn gray big" id="rn">にげる</button>`,
    {bk:()=>{closeModal();B.gaugeStart=performance.now();B.lock=false},rn:()=>{closeModal();if(B&&B.tower)towerEnd(true);else goHome()}})};

(function loop(){requestAnimationFrame(loop);
  if(!B||B.lock||!B.gaugeDur)return;
  const f=(performance.now()-B.gaugeStart)/B.gaugeDur,g=$('gauge');g.style.width=Math.min(100,f*100)+'%';g.classList.toggle('warn',f>.7);
  if(f>=1){B.lock=true;record(B.q,false,B.gaugeDur/1000);B.combo=0;updCombo();markCorrect();setTimeout(()=>monAttack(nextQ),800)}})();

/* =============== boot =============== */
setTimeout(()=>{try{if(FB_CONFIG&&G.fam)syncUp()}catch(e){}},3000);
if(G.profiles.some(p=>p.master)){G.profiles=G.profiles.filter(p=>!p.master);if(!G.profiles.some(p=>p.id===G.cur))G.cur=null;save()}
if(G.cur&&G.profiles.find(p=>p.id===G.cur))selectProfile(G.cur);else{show('players');renderPlayers()}
{try{const jc=new URLSearchParams(location.search).get('join');const st=isStandalone();
  if(st&&(location.search||/index\.html$/.test(location.pathname)))history.replaceState(null,'',location.pathname.replace(/index\.html$/,''));
  if(jc){const c=famNorm(jc);if(c.length!==12)toast('しょうたい コードが ただしくないよ');else if(G.fam!==c&&G.joinSkip!==c)setTimeout(()=>joinInvite(c),900)}}catch(e){}
  setTimeout(installNudge,2500)}

function fitScale(){const w=innerWidth,h=innerHeight,z=Math.max(1,Math.min(w/440,h/800,2.2));document.body.style.zoom=z>1.02?z:'';
  $('app').style.height=z>1.02?(h/z)+'px':'';document.documentElement.style.setProperty('--z',z);document.documentElement.style.setProperty('--zf',z>1.02?z:1)}
addEventListener('resize',()=>{fitScale();if(LN&&LN.pz){lpFit();lpPos()}});fitScale();
